{{ define "content" }}
<article class="qa-hub">
  <header class="qa-head">
    <h1 class="qa-title">{{ .Title }}</h1>
    <p class="qa-intro">{{ .Params.intro }}</p>
    <div class="qa-tools">
      <label class="qa-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input id="qa-filter" type="search" placeholder="Type a word to narrow the list..." autocomplete="off" aria-label="Filter questions">
      </label>
      <span class="qa-count" id="qa-count" aria-live="polite"></span>
    </div>
  </header>

  {{ range $group := site.Data.questions.groups }}
  <section class="qa-group">
    <header class="qa-group-head">
      <span class="qa-group-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">{{ $group.icon | safeHTML }}</svg>
      </span>
      <h2 class="qa-group-title">{{ $group.name }}</h2>
      <span class="qa-group-num" data-group-count>0</span>
    </header>
    <div class="qa-list">
      {{ range $group.items }}
      <details class="qa-item" data-text="{{ printf "%s %s %s" .q .a .detail | lower }}">
        <summary class="qa-summary">
          <span class="qa-item-body">
            <span class="qa-q">{{ .q }}</span>
            <span class="qa-a">{{ .a }}</span>
          </span>
          <span class="qa-plus" aria-hidden="true"></span>
        </summary>
        <div class="qa-detail">
          <p>{{ .detail }}</p>
          <a class="qa-full" href="{{ .url }}">Read the full article <span aria-hidden="true">&#8594;</span></a>
        </div>
      </details>
      {{ end }}
    </div>
  </section>
  {{ end }}

  <p class="qa-empty" id="qa-empty" hidden>Nothing matches that yet. Try a shorter word.</p>
</article>

<style>
.qa-hub {
  --qa-card: rgba(255, 255, 255, .74);
  --qa-border: rgba(15, 23, 42, .10);
  --qa-muted: rgba(15, 23, 42, .64);
  --qa-hover: rgba(0, 102, 204, .06);
  padding: .5rem 0 2.5rem;
}
[data-theme="dark"] .qa-hub {
  --qa-card: rgba(255, 255, 255, .045);
  --qa-border: rgba(255, 255, 255, .12);
  --qa-muted: rgba(229, 229, 229, .62);
  --qa-hover: rgba(77, 171, 247, .09);
}
.qa-title { font-size: clamp(1.7rem, 4vw, 2.2rem); margin: 0 0 .55rem; letter-spacing: -.02em; }
.qa-intro { color: var(--qa-muted); margin: 0; line-height: 1.7; }
.qa-tools { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin: 1.6rem 0 2.2rem; }
.qa-search {
  display: flex; align-items: center; gap: .6rem; flex: 1 1 300px; min-width: 0;
  padding: .72rem 1.05rem; border: 1px solid var(--qa-border); border-radius: 999px;
  background: var(--qa-card); transition: border-color .2s ease, box-shadow .2s ease;
}
.qa-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 102, 204, .12); }
[data-theme="dark"] .qa-search:focus-within { box-shadow: 0 0 0 3px rgba(77, 171, 247, .16); }
.qa-search svg { flex: none; opacity: .6; }
.qa-search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  color: var(--fg); font: inherit; font-size: .95rem;
}
.qa-search input::placeholder { color: var(--qa-muted); opacity: .85; }
.qa-count { font-size: .82rem; color: var(--qa-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.qa-group { margin-bottom: 2.2rem; }
.qa-group-head {
  display: flex; align-items: center; gap: .8rem; margin: 0 0 .9rem;
  padding: .8rem 1rem; border: 1px solid var(--qa-border);
  border-radius: 14px; background: var(--qa-card);
}
.qa-group-icon {
  display: flex; align-items: center; justify-content: center; flex: none;
  width: 2.3rem; height: 2.3rem; border-radius: 10px;
  background: var(--accent); color: #fff;
}
.qa-group-icon svg { width: 1.2rem; height: 1.2rem; }
.qa-group-title { flex: 1; min-width: 0; margin: 0; font-size: 1.06rem; font-weight: 650; letter-spacing: -.01em; }
.qa-group-num {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 1.6rem; height: 1.6rem; padding: 0 .4rem; border-radius: 999px;
  background: var(--qa-hover); border: 1px solid var(--qa-border);
  font-size: .75rem; color: var(--qa-muted); font-variant-numeric: tabular-nums;
}

.qa-list { display: flex; flex-direction: column; gap: .6rem; }
.qa-item {
  border: 1px solid var(--qa-border); border-radius: 14px;
  background: var(--qa-card); overflow: hidden;
  transition: border-color .18s ease, background .18s ease;
}
.qa-item:hover, .qa-item[open] { border-color: var(--accent); }
.qa-item[open] { background: var(--qa-hover); }
.qa-summary {
  display: flex; align-items: center; gap: 1rem; padding: 1rem 1.15rem;
  cursor: pointer; list-style: none; color: var(--fg);
}
.qa-summary::-webkit-details-marker { display: none; }
.qa-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 14px; }
.qa-item-body { display: flex; flex-direction: column; gap: .3rem; min-width: 0; flex: 1; }
.qa-q { font-size: 1.02rem; font-weight: 650; line-height: 1.35; }
.qa-a { font-size: .87rem; color: var(--qa-muted); line-height: 1.5; }
.qa-plus {
  position: relative; flex: none; width: 1.15rem; height: 1.15rem;
  color: var(--accent); transition: transform .2s ease;
}
.qa-plus::before, .qa-plus::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  background: currentColor; border-radius: 2px;
  transform: translate(-50%, -50%);
}
.qa-plus::before { width: 100%; height: 2px; }
.qa-plus::after { width: 2px; height: 100%; }
.qa-item[open] .qa-plus { transform: rotate(45deg); }
.qa-detail { padding: .2rem 1.15rem 1.15rem; border-top: 1px solid var(--qa-border); }
.qa-detail p { margin: .9rem 0 .85rem; font-size: .92rem; line-height: 1.7; color: var(--fg); opacity: .88; }
.qa-full {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .87rem; font-weight: 650; color: var(--accent); text-decoration: none;
}
.qa-full:hover, .qa-full:focus-visible { text-decoration: underline; }
.qa-empty { text-align: center; color: var(--qa-muted); padding: 2.5rem 0; }
.qa-item[hidden], .qa-group[hidden], .qa-empty[hidden] { display: none !important; }
@media (max-width: 640px) {
  .qa-group-head { padding: .7rem .85rem; gap: .65rem; }
  .qa-group-title { font-size: .98rem; }
  .qa-summary { padding: .9rem 1rem; }
  .qa-q { font-size: .96rem; }
  .qa-tools { margin-bottom: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .qa-item, .qa-plus, .qa-search { transition: none; }
}
</style>
{{ end }}
