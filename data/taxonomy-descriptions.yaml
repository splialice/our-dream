tags/game-genres: "Where genre labels come from and where they split, including kinetic novels, dating sims and the naming disputes around visual novels."
tags/game-industry: "Reporting on how studios, publishers and platforms make decisions, grounded in developer statements and public records."
tags/gris: "Nomada Studio's GRIS: its illustrated 2D world, colour-script storytelling and the way it conveys story without dialogue."
tags/illustrative-rendering: "Illustrative rendering in games, how teams build painterly hand-authored looks and where the term overlaps with concept art direction."
tags/narrative-design: "How games tell stories without heavy dialogue, from GRIS's visual cues to visual-novel structure and character writing."
tags/nomada-studio: "Nomada Studio's GRIS and its design choices: illustrated worlds, colour as narrative and dialogue-free storytelling."
