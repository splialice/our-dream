tags/team-fortress-2: "Valve's Team Fortress 2 art makeover: why the team moved away from realism and how early 20th-century illustration shaped the final look."
tags/valve: "Valve's written design rationale on Team Fortress 2 silhouettes, character readability and the shift from realistic to illustrative art direction."
tags/ai-in-games: "How AI is actually used in games and the backlash around it, from Dragon Quest's AI companion to Capcom's hand-built fake New York and player reviews."
