# Descriptions for taxonomy archive pages. Keys are the archive path without the
# leading/trailing slash, e.g. "tags/borderlands" or "categories/game-history".
# Anything not listed here gets a unique generated description from
# layouts/partials/seo/taxonomy-description.html.

# --- Category archives ---
categories/game-history: "Category: dated, source-backed accounts of how games were made, from studio art-direction decisions and genre origins to the contemporary records behind them."
categories/game-design: "Category: how design and rendering choices work in practice, from cel shading and colour scripts to silhouettes and narrative structure, explained with concrete game examples."
categories/visual-novel: "Category: visual novel design, terminology and production, from NVL and ADV text layouts to how small teams build and publish narrative games."
categories/game-culture: "Category: the people and arguments around games, including fan expectations, terminology disputes and how small teams navigate platform rules."
categories/game-industry: "Category: reporting on how game companies, publishers and payment systems shape what gets made, based on developer statements and primary sources."
categories/site-building: "Category: build logs and deployment notes from this Hugo site, covering Cloudflare Pages, PostCSS, CI and the failures behind each fix."
categories/technical-notes: "Category: short technical notes on rendering and tooling, written for readers who want the mechanism rather than the marketing."

# --- Taxonomy index pages ---
tags: "Browse every Pixel Dango topic as a tag archive, from game art direction and cel shading to visual novels, Steam and Hugo deployment notes."
categories: "Browse Pixel Dango by category: game history, game design, visual novels, game culture, industry reporting, site building and technical notes."
series: "Multi-part Pixel Dango series that group related case files into a single reading order."
series/art-direction-changes: "A reading order for Pixel Dango's art-direction case files, tracing how studios changed a game's look and what the dated record actually supports."

# --- High-frequency tags ---
tags/game-art-direction: "Developer statements and dated sources on how games settled on their look, covering Borderlands, Team Fortress 2, GRIS, Firewatch, Journey, Cuphead and Dishonored."
tags/visual-novel: "Visual novel design, terminology and production: NVL versus ADV layouts, kinetic novels, dating-sim boundaries and how small teams build narrative games."
tags/borderlands: "Gearbox's Borderlands art-direction change, the Concept Art Style name and the dated record behind the question of whether the game is cel shaded."
