<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 细网格纹理 -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- 终端窗口 -->
  <rect x="110" y="120" width="980" height="400" rx="12" fill="#12151c" stroke="#2a3040" stroke-width="2"/>
  <!-- 标题栏 -->
  <rect x="110" y="120" width="980" height="46" rx="12" fill="#1a1f2b"/>
  <rect x="110" y="154" width="980" height="12" fill="#1a1f2b"/>
  <circle cx="140" cy="143" r="7" fill="#ff5f57"/>
  <circle cx="164" cy="143" r="7" fill="#febc2e"/>
  <circle cx="188" cy="143" r="7" fill="#28c840"/>
  <text x="230" y="148" font-family="monospace" font-size="15" fill="#5a6478">cloudflare pages · build log</text>

  <!-- 命令行 1：npm install -->
  <text x="145" y="212" font-family="monospace" font-size="19" fill="#5a6478">$</text>
  <text x="172" y="212" font-family="monospace" font-size="19" fill="#8fd4a0">npm install &amp;&amp; hugo --gc --minify</text>

  <!-- 输出行 -->
  <text x="145" y="248" font-family="monospace" font-size="16" fill="#4a5468">Install dependencies: npm install</text>
  <text x="145" y="274" font-family="monospace" font-size="16" fill="#4a5468">added 42 packages in 3s</text>

  <!-- 报错块 -->
  <rect x="135" y="300" width="930" height="150" rx="8" fill="#2a1416" stroke="#5c2226" stroke-width="1.5"/>

  <text x="158" y="332" font-family="monospace" font-size="17" fill="#ff6b6b">Error building site: POSTCSS: failed to transform</text>
  <text x="158" y="358" font-family="monospace" font-size="17" fill="#ff6b6b">"/css/main.css" (text/css).</text>

  <text x="158" y="392" font-family="monospace" font-size="17" fill="#ffd166">You need to install PostCSS.</text>

  <text x="158" y="428" font-family="monospace" font-size="16" fill="#8a94a6">binary with name</text>
  <text x="330" y="428" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">"postcss"</text>
  <text x="425" y="428" font-family="monospace" font-size="16" fill="#8a94a6">not found in PATH</text>

  <!-- 下划线强调 -->
  <path d="M330 434h95" stroke="#ff4d4d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 底部结论条 -->
  <rect x="135" y="470" width="930" height="30" rx="4" fill="#0f1a12"/>
  <text x="158" y="491" font-family="monospace" font-size="15" fill="#5ec97a">→ 缺的不是 Hugo 版本，是构建时没跑 npm install</text>

  <!-- 右下角标记 -->
  <text x="1090" y="580" font-family="monospace" font-size="14" fill="#3a4354" text-anchor="end">pixeldango.com</text>

</svg>