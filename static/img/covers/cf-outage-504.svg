  <text x="470" y="450" font-family="monospace" font-size="17" fill="#3ddc84" font-weight="bold">9 succeeded</text>
  <text x="150" y="482" font-family="monospace" font-size="15" fill="#8a94a8">articles actually live</text>
  <text x="470" y="482" font-family="monospace" font-size="17" fill="#ff4d4d" font-weight="bold">0</text>

  <!-- 底部结论条 -->
  <rect x="90" y="562" width="1020" height="2" fill="url(#accent)" opacity="0.85"/>
  <text x="90" y="600" font-family="monospace" font-size="17" fill="#c3cad9">A green checkmark on the push is compatible with an immediate collapse during the build.</text>

